[project]
name = "devanagari-steering"
version = "0.1.0"
description = "Hindi-to-sister-language inference-time representation steering on Devanagari low-resource languages."
authors = [{ name = "Sumit Yadav" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "datasets>=2.20,<3.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "indic-nlp-library>=0.92",
    "sacrebleu>=2.4",
    "google-genai>=0.8",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]

[project.optional-dependencies]
translate = [
    # IndicTrans2 for Hindi-target parallels; install per AI4Bharat instructions
    "sentencepiece>=0.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py310"
